[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "vehicle-diagnostics-validation-lab"
version = "1.0.0"
description = "Educational simulated vehicle diagnostics and automated regression testing"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
test = ["pytest>=8"]
dashboard = ["streamlit>=1.35", "pandas>=2.0", "plotly>=5.20"]
ml = ["scikit-learn>=1.4", "pandas>=2.0", "joblib>=1.3"]
all = ["pytest>=8", "streamlit>=1.35", "pandas>=2.0", "plotly>=5.20", "scikit-learn>=1.4", "joblib>=1.3"]
[project.scripts]
vehicle-diagnostics = "vehicle_diagnostics.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
